<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NE India Red Zone — GIS Decision Support</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; height: 100vh; }
    
    /* Sidebar */
    #sidebar {
      width: 420px; min-width: 420px; background: #1a1a2e; color: #e0e0e0;
      display: flex; flex-direction: column; overflow: hidden; z-index: 1000;
      box-shadow: 2px 0 10px rgba(0,0,0,0.3);
    }
    #sidebar.collapsed { width: 0; min-width: 0; }
    #sidebar-header { padding: 16px 20px; background: #16213e; border-bottom: 1px solid #333; }
    #sidebar-header h1 { font-size: 18px; color: #fff; margin-bottom: 4px; }
    #sidebar-header p { font-size: 12px; color: #888; }
    
    /* Stats Bar */
    #stats-bar {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
      padding: 12px 16px; background: #16213e; border-bottom: 1px solid #333;
    }
    .stat-box { text-align: center; padding: 8px 4px; border-radius: 6px; background: #0f3460; }
    .stat-box .num { font-size: 20px; font-weight: 700; }
    .stat-box .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #aaa; }
    .stat-red .num { color: #e74c3c; }
    .stat-orange .num { color: #f39c12; }
    .stat-green .num { color: #2ecc71; }
    .stat-immediate .num { color: #ff6b6b; }
    
    /* Filters */
    #filters {
      padding: 12px 16px; display: flex; gap: 8px; flex-wrap: wrap;
      background: #1a1a2e; border-bottom: 1px solid #333;
    }
    #filters input, #filters select {
      padding: 8px 12px; border-radius: 6px; border: 1px solid #444;
      background: #0f3460; color: #fff; font-size: 13px; outline: none;
    }
    #filters input { flex: 1; min-width: 150px; }
    #filters select { min-width: 100px; }
    #filters input:focus, #filters select:focus { border-color: #3498db; }
    
    /* Buttons */
    #controls {
      padding: 8px 16px; display: flex; gap: 8px; background: #1a1a2e; border-bottom: 1px solid #333;
    }
    .btn {
      padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer;
      font-size: 12px; font-weight: 600; transition: all 0.2s;
    }
    .btn-primary { background: #3498db; color: #fff; }
    .btn-primary:hover { background: #2980b9; }
    .btn-danger { background: #e74c3c; color: #fff; }
    .btn-danger:hover { background: #c0392b; }
    .btn-success { background: #2ecc71; color: #fff; }
    .btn-success:hover { background: #27ae60; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    /* Village List */
    #village-list {
      flex: 1; overflow-y: auto; padding: 8px;
    }
    .village-card {
      padding: 12px; margin-bottom: 6px; background: #16213e; border-radius: 8px;
      cursor: pointer; border-left: 4px solid #444; transition: all 0.2s;
    }
    .village-card:hover { background: #1a2744; transform: translateX(2px); }
    .village-card.zone-RED { border-left-color: #e74c3c; }
    .village-card.zone-ORANGE { border-left-color: #f39c12; }
    .village-card.zone-GREEN { border-left-color: #2ecc71; }
    .village-card .name { font-size: 14px; font-weight: 600; color: #fff; }
    .village-card .meta { font-size: 11px; color: #888; margin-top: 2px; }
    .village-card .score {
      font-size: 13px; font-weight: 700; margin-top: 4px;
    }
    .village-card .timeline {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 10px; font-weight: 700; margin-top: 4px; margin-left: 8px;
    }
    .timeline-IMMEDIATE { background: #e74c3c; color: #fff; }
    .timeline-SHORT_TERM { background: #f39c12; color: #fff; }
    .timeline-MEDIUM_TERM { background: #3498db; color: #fff; }
    .timeline-MONITOR { background: #555; color: #ccc; }
    
    /* Detail Panel */
    #detail-panel {
      display: none; position: fixed; right: 0; top: 0; width: 450px; height: 100vh;
      background: #1a1a2e; z-index: 2000; overflow-y: auto;
      box-shadow: -4px 0 20px rgba(0,0,0,0.5);
    }
    #detail-panel.open { display: block; }
    #detail-header {
      padding: 20px; background: #16213e; border-bottom: 1px solid #333;
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    #detail-header h2 { font-size: 20px; color: #fff; }
    #detail-close {
      background: none; border: none; color: #888; font-size: 24px; cursor: pointer;
      padding: 0 8px;
    }
    #detail-close:hover { color: #fff; }
    #detail-body { padding: 20px; }
    .detail-section { margin-bottom: 20px; }
    .detail-section h3 { font-size: 13px; text-transform: uppercase; color: #888; margin-bottom: 8px; letter-spacing: 1px; }
    .detail-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #222; }
    .detail-row .key { color: #aaa; font-size: 13px; }
    .detail-row .val { color: #fff; font-size: 13px; font-weight: 600; }
    .shap-item {
      padding: 8px 12px; margin-bottom: 4px; background: #0f3460; border-radius: 6px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .shap-item .feat { font-size: 12px; color: #ddd; }
    .shap-item .val { font-size: 12px; font-weight: 600; }
    .shap-item .impact {
      font-size: 10px; padding: 2px 6px; border-radius: 8px; font-weight: 700;
    }
    .impact-high { background: #e74c3c; color: #fff; }
    .impact-medium { background: #f39c12; color: #fff; }
    .impact-low { background: #555; color: #ccc; }
    
    .match-item {
      padding: 10px 12px; margin-bottom: 6px; background: #16213e; border-radius: 6px;
      border-left: 3px solid #2ecc71;
    }
    .match-item .name { font-weight: 600; color: #2ecc71; }
    .match-item .info { font-size: 11px; color: #888; margin-top: 4px; }
    
    /* Map */
    #map { flex: 1; z-index: 1; }
    
    /* Legend */
    .legend {
      background: rgba(26,26,46,0.95); padding: 12px 16px; border-radius: 8px;
      font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .legend h4 { margin-bottom: 8px; color: #fff; font-size: 13px; }
    .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
    
    /* Loading */
    #loading {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #1a1a2e; z-index: 9999; display: flex;
      align-items: center; justify-content: center; flex-direction: column;
    }
    #loading h2 { color: #fff; margin-bottom: 16px; }
    #loading .spinner {
      width: 40px; height: 40px; border: 4px solid #333;
      border-top-color: #3498db; border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1a1a2e; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
  </style>
</head>
<body>
  <!-- Loading -->
  <div id="loading">
    <h2>Loading NE India Red Zone Platform...</h2>
    <div class="spinner"></div>
  </div>

  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>🚨 NE India Red Zone</h1>
      <p>GIS Decision Support Platform — Problem 26191</p>
    </div>
    
    <div id="stats-bar">
      <div class="stat-box stat-red"><div class="num" id="stat-red">-</div><div class="label">Red Zones</div></div>
      <div class="stat-box stat-orange"><div class="num" id="stat-orange">-</div><div class="label">Orange Zones</div></div>
      <div class="stat-box stat-green"><div class="num" id="stat-green">-</div><div class="label">Green Zones</div></div>
      <div class="stat-box stat-immediate"><div class="num" id="stat-immediate">-</div><div class="label">Immediate</div></div>
    </div>
    
    <div id="filters">
      <input type="text" id="search-input" placeholder="🔍 Search village, district...">
      <select id="zone-filter">
        <option value="">All Zones</option>
        <option value="RED">🔴 Red</option>
        <option value="ORANGE">🟠 Orange</option>
        <option value="GREEN">🟢 Green</option>
      </select>
      <select id="state-filter">
        <option value="">All States</option>
      </select>
      <select id="timeline-filter">
        <option value="">All Timelines</option>
        <option value="IMMEDIATE">🚨 Immediate</option>
        <option value="SHORT_TERM">⏰ Short-term</option>
        <option value="MEDIUM_TERM">📋 Medium-term</option>
        <option value="MONITOR">👁️ Monitor</option>
      </select>
    </div>
    
    <div id="controls">
      <button class="btn btn-primary" onclick="refreshData()">🔄 Refresh</button>
      <button class="btn btn-danger" onclick="showOnlyImmediate()">🚨 Show IMMEDIATE</button>
      <button class="btn btn-success" onclick="exportCSV()">📥 Export</button>
      <span id="result-count" style="color:#888;font-size:12px;line-height:32px;margin-left:auto;"></span>
    </div>
    
    <div id="village-list"></div>
  </div>

  <!-- Map -->
  <div id="map"></div>

  <!-- Detail Panel -->
  <div id="detail-panel">
    <div id="detail-header">
      <div>
        <h2 id="detail-name">-</h2>
        <p id="detail-location" style="color:#888;font-size:13px;">-</p>
      </div>
      <button id="detail-close" onclick="closeDetail()">✕</button>
    </div>
    <div id="detail-body"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    const API = '';  // Same origin
    let map, clusterGroup;
    let allVillages = [];
    let currentFiltered = [];

    // ── Initialize Map ────────────────────────────────────────────────────
    function initMap() {
      map = L.map('map', { zoomControl: true }).setView([25.5, 93.5], 7);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '© OpenStreetMap contributors, © CARTO',
        maxZoom: 18,
      }).addTo(map);

      // Legend
      const legend = L.control({ position: 'bottomright' });
      legend.onAdd = function() {
        const div = L.DomUtil.create('div', 'legend');
        div.innerHTML = `
          <h4>Risk Zones</h4>
          <div class="legend-item"><div class="legend-dot" style="background:#e74c3c"></div> RED — High Risk</div>
          <div class="legend-item"><div class="legend-dot" style="background:#f39c12"></div> ORANGE — Medium Risk</div>
          <div class="legend-item"><div class="legend-dot" style="background:#2ecc71"></div> GREEN — Low Risk</div>
          <h4 style="margin-top:8px">Relocation</h4>
          <div class="legend-item"><div class="legend-dot" style="background:#ff6b6b"></div> IMMEDIATE</div>
          <div class="legend-item"><div class="legend-dot" style="background:#ffa502"></div> SHORT_TERM</div>
          <div class="legend-item"><div class="legend-dot" style="background:#3498db"></div> MEDIUM_TERM</div>
        `;
        return div;
      };
      legend.addTo(map);
    }

    // ── Load Data ─────────────────────────────────────────────────────────
    async function loadStats() {
      const res = await fetch(`${API}/api/stats`);
      const data = await res.json();
      document.getElementById('stat-red').textContent = data.zone_distribution.RED.toLocaleString();
      document.getElementById('stat-orange').textContent = data.zone_distribution.ORANGE.toLocaleString();
      document.getElementById('stat-green').textContent = data.zone_distribution.GREEN.toLocaleString();
      document.getElementById('stat-immediate').textContent = data.timeline_distribution.IMMEDIATE.toLocaleString();
    }

    async function loadStates() {
      const res = await fetch(`${API}/api/state_summary`);
      const data = await res.json();
      const sel = document.getElementById('state-filter');
      data.states.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.state;
        opt.textContent = `${s.state} (${s.total_villages.toLocaleString()})`;
        sel.appendChild(opt);
      });
    }

    async function loadVillages(params = {}) {
      const qs = new URLSearchParams();
      if (params.zone) qs.set('zone', params.zone);
      if (params.state) qs.set('state', params.state);
      if (params.timeline) qs.set('timeline', params.timeline);
      if (params.search) qs.set('search', params.search);
      qs.set('limit', '50000');

      const res = await fetch(`${API}/api/villages?${qs}`);
      const data = await res.json();
      return data.villages;
    }

    // ── Render Map Markers ────────────────────────────────────────────────
    function getZoneColor(zone) {
      return zone === 'RED' ? '#e74c3c' : zone === 'ORANGE' ? '#f39c12' : '#2ecc71';
    }

    function renderMarkers(villages) {
      if (clusterGroup) map.removeLayer(clusterGroup);
      clusterGroup = L.markerClusterGroup({
        maxClusterRadius: 40,
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false,
        iconCreateFunction: function(cluster) {
          const count = cluster.getChildCount();
          let size = count < 50 ? 30 : count < 200 ? 40 : 50;
          // Color by dominant zone
          const children = cluster.getAllChildVotes ? cluster.getAllChildVotes() : {};
          return L.divIcon({
            html: `<div style="
              width:${size}px;height:${size}px;border-radius:50%;
              background:rgba(231,76,60,0.8);color:#fff;
              display:flex;align-items:center;justify-content:center;
              font-size:${size/3}px;font-weight:700;
              border:2px solid rgba(255,255,255,0.3);
            ">${count}</div>`,
            className: '',
          });
        },
      });

      villages.forEach(v => {
        if (v.latitude == null || v.longitude == null) return;
        const color = getZoneColor(v.risk_zone);
        const size = v.risk_score >= 0.85 ? 7 : v.risk_score >= 0.7 ? 5 : 4;

        const marker = L.circleMarker([v.latitude, v.longitude], {
          radius: size,
          fillColor: color,
          color: '#fff',
          weight: 0.5,
          fillOpacity: 0.85,
        });

        marker.bindTooltip(
          `<b>${v.village_name}</b><br>${v.district}, ${v.state}<br>Score: ${v.risk_score.toFixed(3)}`,
          { direction: 'top', offset: [0, -5] }
        );

        marker.on('click', () => showDetail(v.village_id));
        clusterGroup.addLayer(marker);
      });

      map.addLayer(clusterGroup);
    }

    // ── Render Village List ───────────────────────────────────────────────
    function renderList(villages) {
      const list = document.getElementById('village-list');
      // Sort by risk_score desc
      villages.sort((a, b) => b.risk_score - a.risk_score);
      
      const html = villages.slice(0, 500).map(v => `
        <div class="village-card zone-${v.risk_zone}" onclick="showDetail('${v.village_id}'); panTo(${v.latitude}, ${v.longitude})">
          <div class="name">${v.village_name}</div>
          <div class="meta">${v.district}, ${v.state}</div>
          <span class="score" style="color:${getZoneColor(v.risk_zone)}">${v.risk_score.toFixed(3)}</span>
          <span class="timeline timeline-${v.relocation_timeline}">${v.relocation_timeline}</span>
        </div>
      `).join('');

      list.innerHTML = html || '<p style="padding:20px;color:#888;text-align:center;">No villages match filters</p>';
      document.getElementById('result-count').textContent = `${villages.length.toLocaleString()} villages`;
    }

    // ── Detail Panel ──────────────────────────────────────────────────────
    async function showDetail(villageId) {
      const panel = document.getElementById('detail-panel');
      panel.classList.add('open');

      document.getElementById('detail-name').textContent = 'Loading...';
      document.getElementById('detail-body').innerHTML = '';

      try {
        const res = await fetch(`${API}/api/villages/${villageId}`);
        const v = await res.json();

        document.getElementById('detail-name').textContent = v.village_name;
        document.getElementById('detail-location').textContent = `${v.district}, ${v.state}`;

        let html = '';

        // Risk Info
        const zoneColor = getZoneColor(v.risk_zone);
        html += `
          <div class="detail-section">
            <h3>Risk Assessment</h3>
            <div class="detail-row"><span class="key">Risk Score</span><span class="val" style="color:${zoneColor}">${v.risk_score.toFixed(4)}</span></div>
            <div class="detail-row"><span class="key">Risk Zone</span><span class="val" style="color:${zoneColor}">${v.risk_zone}</span></div>
            <div class="detail-row"><span class="key">Timeline</span><span class="val"><span class="timeline timeline-${v.relocation_timeline}">${v.relocation_timeline}</span></span></div>
            <div class="detail-row"><span class="key">Coordinates</span><span class="val">${v.latitude?.toFixed(4)}°N, ${v.longitude?.toFixed(4)}°E</span></div>
            <div class="detail-row"><span class="key">Habitation ID</span><span class="val">${v.village_id}</span></div>
            ${v.low_confidence ? '<div class="detail-row"><span class="key">⚠️ Confidence</span><span class="val" style="color:#f39c12">PARTIAL DATA</span></div>' : ''}
          </div>
        `;

        // Physical Features
        html += `<div class="detail-section"><h3>Physical Features</h3>`;
        const features = [
          ['elevation_m', 'Elevation', 'm'],
          ['slope_degrees', 'Slope', '°'],
          ['max_daily_rainfall_mm', 'Max Rainfall', 'mm'],
          ['dist_to_nearest_landslide_km', 'Dist to Landslide', 'km'],
          ['landslide_density_50km', 'Landslide Density (50km)', ''],
          ['dist_to_nearest_flood_km', 'Dist to Flood Zone', 'km'],
          ['flood_density_50km', 'Flood Density (50km)', ''],
          ['dist_to_nearest_river_km', 'Dist to River', 'km'],
          ['dist_to_nearest_road_km', 'Dist to Road', 'km'],
          ['landcover_class', 'Land Cover', ''],
        ];
        features.forEach(([key, label, unit]) => {
          if (v[key] != null) {
            html += `<div class="detail-row"><span class="key">${label}</span><span class="val">${typeof v[key] === 'number' ? v[key].toFixed(1) : v[key]}${unit}</span></div>`;
          }
        });
        html += `</div>`;

        // SHAP Factors
        if (v.live_shap && v.live_shap.length > 0) {
          html += `<div class="detail-section"><h3>Top Risk Factors (SHAP)</h3>`;
          v.live_shap.forEach(f => {
            html += `
              <div class="shap-item">
                <span class="feat">${f.feature.replace(/_/g, ' ')}</span>
                <span class="val">${f.value}</span>
                <span class="impact impact-${f.impact}">${f.impact.toUpperCase()}</span>
              </div>
            `;
          });
          html += `</div>`;
        }

        // Relocation Matches (for RED villages)
        if (v.risk_zone === 'RED') {
          try {
            const mRes = await fetch(`${API}/api/matches/${villageId}`);
            const mData = await mRes.json();
            if (mData.matches && mData.matches.length > 0) {
              html += `<div class="detail-section"><h3>🏕️ Top Relocation Sites</h3>`;
              mData.matches.forEach(m => {
                html += `
                  <div class="match-item">
                    <div class="name">➡️ ${m.target_village_name}</div>
                    <div class="info">
                      ${m.distance_km} km away | Capacity Score: ${m.carrying_capacity_score.toFixed(2)} | Remaining: ${m.remaining_capacity.toLocaleString()} people
                    </div>
                  </div>
                `;
              });
              html += `</div>`;
            } else {
              html += `<div class="detail-section"><h3>🏕️ Relocation</h3><p style="color:#888">No safe site found within 50km</p></div>`;
            }
          } catch(e) {}
        }

        html += `
          <div class="detail-section" style="text-align:center;margin-top:20px;">
            <button class="btn btn-primary" onclick="panTo(${v.latitude}, ${v.longitude})">📍 Focus on Map</button>
          </div>
        `;

        document.getElementById('detail-body').innerHTML = html;
      } catch(e) {
        document.getElementById('detail-body').innerHTML = `<p style="color:#e74c3c">Error loading village: ${e.message}</p>`;
      }
    }

    function closeDetail() {
      document.getElementById('detail-panel').classList.remove('open');
    }

    function panTo(lat, lng) {
      if (lat && lng) map.setView([lat, lng], 12);
    }

    // ── Filters ───────────────────────────────────────────────────────────
    let searchTimeout;
    document.getElementById('search-input').addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => applyFilters(), 300);
    });
    document.getElementById('zone-filter').addEventListener('change', () => applyFilters());
    document.getElementById('state-filter').addEventListener('change', () => applyFilters());
    document.getElementById('timeline-filter').addEventListener('change', () => applyFilters());

    async function applyFilters() {
      const params = {
        zone: document.getElementById('zone-filter').value,
        state: document.getElementById('state-filter').value,
        timeline: document.getElementById('timeline-filter').value,
        search: document.getElementById('search-input').value,
      };

      const villages = await loadVillages(params);
      currentFiltered = villages;
      renderMarkers(villages);
      renderList(villages);
    }

    // ── Actions ───────────────────────────────────────────────────────────
    function showOnlyImmediate() {
      document.getElementById('zone-filter').value = '';
      document.getElementById('state-filter').value = '';
      document.getElementById('search-input').value = '';
      document.getElementById('timeline-filter').value = 'IMMEDIATE';
      applyFilters();
    }

    async function refreshData() {
      const btn = event.target;
      btn.disabled = true;
      btn.textContent = '⏳ Refreshing...';
      try {
        const res = await fetch(`${API}/api/refresh`, { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          alert(`✅ ${data.message}`);
          await loadStats();
          await applyFilters();
        } else {
          alert(`❌ Refresh failed: ${data.error}`);
        }
      } catch(e) {
        alert(`❌ Refresh failed: ${e.message}`);
      }
      btn.disabled = false;
      btn.textContent = '🔄 Refresh';
    }

    async function exportCSV() {
      const villages = currentFiltered.length > 0 ? currentFiltered : await loadVillages();
      const headers = ['village_id','village_name','district','state','latitude','longitude','risk_score','risk_zone','relocation_timeline'];
      const rows = villages.map(v => headers.map(h => v[h] ?? '').join(','));
      const csv = [headers.join(','), ...rows].join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `red_zone_export_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    // ── Init ──────────────────────────────────────────────────────────────
    async function init() {
      initMap();
      await Promise.all([loadStats(), loadStates()]);
      const villages = await loadVillages({ zone: 'RED' });
      currentFiltered = villages;
      renderMarkers(villages);
      renderList(villages);
      document.getElementById('loading').style.display = 'none';
    }

    init().catch(err => {
      document.getElementById('loading').innerHTML = `
        <h2 style="color:#e74c3c">Failed to load</h2>
        <p style="color:#888;margin-top:8px">${err.message}</p>
        <p style="color:#888;margin-top:16px">Make sure the backend is running:<br><code>cd backend && python main.py</code></p>
      `;
    });
  </script>
</body>
</html>
